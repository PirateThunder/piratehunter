[project]
name = "piratehunter-backend"
version = "0.1.0"
description = "Публичный API платформы PirateHunter (/api/v1): auth, профили, ПДн, приглашения, оркестрация core-api и fsp_registry"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10.1",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "redis>=5.2.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.52.1",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # naive datetime по дизайну (колонки DateTime без tz)
    "ignore:datetime.datetime.utcnow.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
