[project]
name = "hunter-core"
version = "0.1.0"
description = "CLI-ядро платформы подбора ИТ-специалистов: банк заданий, адаптивный тест (CAT-lite), скоринг/матчинг, валидационный харнесс"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2",
    "httpx>=0.28",
    "matplotlib>=3.10",
    "fastapi>=0.142.3",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.32.0",
    "pydantic-settings>=2.15.0",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
