[project]
name = "fsp-registry"
version = "0.1.0"
description = "Мок-реестр достижений ФСП + мок-OIDC провайдер «FSP ID» (internal-сервис, PRD §5.3, §8.3)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "pydantic>=2.11",
    "pydantic-settings>=2.15",
    "pyjwt>=2.10",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=1.4",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
